 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 HealthChecker - Your Personal Health Companion</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 20px;
            color: #ffffff;
            font-size: 3.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
            color: #ffffff;
            font-size: 2.3em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Form Styles */
        form {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            border-left: 5px solid #667eea;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 18px;
            background-color: #f8f9ff;
            color: #333;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        form input:focus {
            outline: none;
            border-color: #667eea;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        form button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            letter-spacing: 0.5px;
        }

        form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        form button:active {
            transform: translateY(0);
        }

        /* Health Records Table */
        table {
            width: 100%;
            max-width: 1200px;
            border-collapse: collapse;
            margin-bottom: 40px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        th, td {
            padding: 18px 16px;
            text-align: left;
            border-bottom: 1px solid #e8eef5;
            font-size: 18px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:hover {
            background: linear-gradient(90deg, #f0f4ff 0%, #f8f9ff 100%);
            box-shadow: inset 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        tr:nth-child(even) {
            background-color: #f8f9ff;
        }

        tr:nth-child(even):hover {
            background: linear-gradient(90deg, #e8eef5 0%, #f0f4ff 100%);
        }

        /* Delete Button */
        button[onclick*="deleteRecord"] {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(245, 87, 108, 0.3);
        }

        button[onclick*="deleteRecord"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.5);
        }

        /* Responsive */
        @media (max-width: 600px) {
            form, table {
                width: 95%;
            }

            h1 {
                font-size: 2.5em;
            }

            h2 {
                font-size: 1.8em;
            }

            th, td {
                padding: 12px 8px;
                font-size: 13px;
            }
        }

        /* Logo and Header Styles */
        .header-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .header-text h1 {
            margin: 0;
            padding: 0;
            font-size: 2.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-text p {
            margin: 8px 0 0 0;
            color: #e0e7ff;
            font-size: 1.1em;
            letter-spacing: 1.2px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Circle Background -->
                <circle cx="50" cy="50" r="48" fill="#ffffff" opacity="0.95"/>
                
                <!-- Heart Shape -->
                <path d="M50 85 C25 70, 20 55, 20 45 C20 35, 28 28, 35 28 C42 28, 50 35, 50 35 C50 35, 58 28, 65 28 C72 28, 80 35, 80 45 C80 55, 75 70, 50 85 Z" 
                      fill="url(#heartGradient)" stroke="#667eea" stroke-width="2"/>
                
                <!-- Plus Sign for Medical -->
                <g fill="#764ba2">
                    <rect x="45" y="38" width="10" height="24" rx="2"/>
                    <rect x="38" y="45" width="24" height="10" rx="2"/>
                </g>
                
                <!-- Gradient Definition -->
                <defs>
                    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="header-text">
            <h1>HealthChecker</h1>
            <p>Your Personal Health Companion</p>
        </div>
    </div>

    <form id="healthForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required placeholder="Enter your full name">

        <label for="age">Age:</label>
        <input type="number" id="age" required placeholder="Enter your age">

        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="Enter your email">

        <label for="heartRate">Heart Rate (bpm):</label>
        <input type="number" id="heartRate" required placeholder="e.g., 72">

        <label for="bloodPressure">Blood Pressure:</label>
        <input type="text" id="bloodPressure" required placeholder="e.g., 120/80">

        <button type="submit">Submit</button>
    </form>

    <h2>Health Records</h2>
    <table id="recordsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Heart Rate</th>
                <th>Blood Pressure</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="records">
            <!-- Records will appear here -->
        </tbody>
    </table>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
